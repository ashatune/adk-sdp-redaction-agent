[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-sdp-redaction-agent"
version = "0.1.0"
description = "Reference Google ADK agent with Cloud Model Armor prompt screening and post-inference Cloud SDP in-place redaction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-modelarmor>=0.1.0",
    "google-genai>=1.10.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_gcp: integration tests that invoke live GCP Cloud SDP / Vertex AI endpoints",
]
